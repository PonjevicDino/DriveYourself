behaviors:
  TestModel:
    hyperparameters:
      batch_size: 4096
      beta: 0.01
      beta_schedule: linear
      buffer_size: 81920
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      learning_rate: 0.0003
      learning_rate_schedule: linear
      num_epoch: 4
    max_steps: 5000000
    network_settings:
      hidden_units: 128
      normalize: true
      num_layers: 4
      sequence_length: 16
      use_recurrent: true
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    summary_freq: 320000
    threaded: true
    time_horizon: 64
    trainer_type: ppo
environment_parameters:
  dtc_weight: 0.83
  target_speed: 48.0
